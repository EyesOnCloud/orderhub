[project]
name = "orderhub"
version = "0.1.0"
description = "Small order management service used as a training repository"
requires-python = ">=3.10"
 
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
 
[tool.ruff]
line-length = 100
target-version = "py310"
 
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
